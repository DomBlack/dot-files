[tools]
# agent-session observability TUI (Claude Code/Codex history, cost, tokens);
# github backend pulls the release binary — one pin for mac + devboxes
"github:luoyuctl/agenttrace" = "0.5.4"
go = "1.27.1"

[env]
# mise points GOBIN at each Go version's own bin dir, so a `go install`ed tool
# vanishes in any repo pinning another Go. Keep them all in ~/bin (GOPATH is
# $HOME, see fish conf.d/go.fish) whichever Go built them.
GOBIN = "{{env.HOME}}/bin"

[hooks]
# dlv is the exception: it's tied to the Go it debugs, so every Go version gets
# its own, built by that Go into its own bin dir (which comes before ~/bin on
# PATH). Fires after any install, whichever config pinned the Go.
postinstall = '''
for d in "${MISE_DATA_DIR:-$HOME/.local/share/mise}"/installs/go/*/; do
  d="${d%/}"
  [ -L "$d" ] || [ -x "$d/bin/dlv" ] || [ ! -x "$d/bin/go" ] && continue
  echo "installing dlv for go $(basename "$d")"
  GOROOT="$d" GOBIN="$d/bin" GOTOOLCHAIN=local "$d/bin/go" install github.com/go-delve/delve/cmd/dlv@latest
done
'''

[settings]
# honour work repos' .nvmrc / .node-version files
idiomatic_version_file_enable_tools = ["node"]
# mise's own missing-tools stderr warning is off: the starship prompt module
# (custom.mise_missing, red ⚠) is the single visible signal for missing pins
status.missing_tools = "never"
